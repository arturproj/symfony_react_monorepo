server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    # Log (utile durante il debug iniziale in produzione)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Limite upload (adatta se carichi file grandi)
    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Blocca l'accesso diretto a qualsiasi altro file .php
    location ~ \.php$ {
        return 404;
    }

    # Asset compilati da Webpack Encore: cache lunga (hash nel filename)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # File statici generici
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Nasconde file/cartelle nascosti (es. .env, .git)
    location ~ /\. {
        deny all;
    }
}